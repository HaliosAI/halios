name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify versions
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ref = os.environ["GITHUB_REF_NAME"]
          expected = ref[1:] if ref.startswith("v") else ref

          package = Path("halios_cli/_version.py").read_text(encoding="utf-8")
          package_version = re.search(r'__version__\s*=\s*"([^"]+)"', package).group(1)

          skill = Path("skills/halios/SKILL.md").read_text(encoding="utf-8")
          skill_version = re.search(r'^\s*version:\s*"([^"]+)"', skill, re.MULTILINE).group(1)
          min_cli = re.search(r'^\s*min_halios_cli:\s*"([^"]+)"', skill, re.MULTILINE).group(1)

          assert package_version == expected, f"Package version {package_version} != {expected}"
          assert skill_version == expected, f"Skill version {skill_version} != {expected}"
          assert min_cli == expected, f"Skill min_halios_cli {min_cli} != {expected}"
          print(f"Verified release version {expected} matches CLI and Skill.")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - shell: bash
        run: |
          python -m venv .smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin=.smoke/Scripts/python
            halios_bin=.smoke/Scripts/halios.exe
          else
            python_bin=.smoke/bin/python
            halios_bin=.smoke/bin/halios
          fi
          wheel="$(find dist -name '*.whl' -print -quit)"
          "$python_bin" -m pip install "$wheel"
          test "$("$halios_bin" --version)" = "${GITHUB_REF_NAME#v}"
          "$halios_bin" --help

  publish:
    needs: install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
