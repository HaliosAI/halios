name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify versions
        run: |
          expected="${GITHUB_REF_NAME#v}"
          package="$(python -c 'from halios_cli._version import __version__; print(__version__)')"
          skill="$(python -c 'import re; from pathlib import Path; print(re.search(r"^\\s+version:\\s*\\\"([^\\\"]+)\\\"", Path("skills/halios/SKILL.md").read_text(), re.M).group(1))')"
          test "$package" = "$expected"
          test "$skill" = "$expected"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - shell: bash
        run: |
          python -m venv .smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin=.smoke/Scripts/python
            halios_bin=.smoke/Scripts/halios.exe
          else
            python_bin=.smoke/bin/python
            halios_bin=.smoke/bin/halios
          fi
          wheel="$(find dist -name '*.whl' -print -quit)"
          "$python_bin" -m pip install "$wheel"
          test "$("$halios_bin" --version)" = "${GITHUB_REF_NAME#v}"
          "$halios_bin" --help

  publish:
    needs: install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
