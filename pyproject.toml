[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haliosai-cli"
dynamic = ["version"]
description = "Halios CLI for coding-agent evaluations, guardrails, and OpenTelemetry evidence"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HaliosLabs", email = "support@halios.ai" }]
requires-python = ">=3.10"
keywords = ["ai", "agents", "evaluation", "guardrails", "opentelemetry", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.18,<5",
    "PyYAML>=6.0,<7",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.9",
    "twine>=6",
]

[project.urls]
Homepage = "https://halios.ai"
Documentation = "https://docs.halios.ai"
Repository = "https://github.com/HaliosAI/halios"
Changelog = "https://github.com/HaliosAI/halios/releases"

[project.scripts]
halios = "halios_cli.cli:app"

[tool.setuptools.dynamic]
version = { attr = "halios_cli._version.__version__" }

[tool.setuptools.packages.find]
include = ["halios_cli", "halios_cli.schemas"]

[tool.setuptools.package-data]
halios_cli = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
